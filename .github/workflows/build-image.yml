name: Build Wrapper Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/soju/**'
      - 'charts/soju/values.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build and Push Wrapper Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract pinned soju version
        id: version
        run: |
          TAG=$(grep -A2 '^image:' charts/soju/values.yaml | grep 'tag:' | head -1 | sed 's/.*tag: *"\(.*\)".*/\1/')
          echo "Pinned soju version: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wrapper image
        uses: docker/build-push-action@v7
        with:
          context: docker/soju
          file: docker/soju/Dockerfile
          build-args: |
            SOJU_VERSION=${{ steps.version.outputs.tag }}
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/soju:${{ steps.version.outputs.tag }}

      - name: Run Trivy for wrapper image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/soju:${{ steps.version.outputs.tag }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
