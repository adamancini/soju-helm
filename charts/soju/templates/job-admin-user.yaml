{{- if .Values.admin.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "soju.fullname" . }}-admin-setup
  labels:
    {{- include "soju.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "soju.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin-setup
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: create-admin
        image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command:
        - sh
        - -c
        - |
          if OUTPUT=$(echo "$ADMIN_PASS" | sojudb -config /etc/soju/config create-user "$ADMIN_USER" -admin 2>&1); then
            printf '%s\n' "$OUTPUT"
            exit 0
          fi
          printf '%s\n' "$OUTPUT" >&2
          # sojudb create-user has exactly one uniquely-constrained column
          # (User.username), so this can only match a username collision --
          # re-verify if this pattern is ever reused for another subcommand.
          case "$OUTPUT" in
            *"UNIQUE constraint failed"*|*"duplicate key value violates unique constraint"*)
              printf 'Admin user "%s" already exists, nothing to do.\n' "$ADMIN_USER"
              exit 0
              ;;
          esac
          exit 1
        env:
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "soju.adminSecretName" . }}
              key: admin-username
        - name: ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "soju.adminSecretName" . }}
              key: admin-password
        volumeMounts:
        - name: config
          mountPath: /etc/soju
          readOnly: true
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: /data
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "soju.fullname" . }}-config
          items:
          - key: config
            path: config
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "soju.fullname" . }}-data
      {{- end }}
{{- end }}
